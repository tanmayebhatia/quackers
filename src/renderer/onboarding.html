<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Pick your Quacker</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      padding: 22px 26px 24px;
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(#fdf8ee, #f6ead2);
      color: #4a4437;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    h1 { font-size: 19px; margin: 0 0 2px; }
    .sub { margin: 0 0 14px; font-size: 12.5px; opacity: 0.65; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .card {
      background: #fffdf6;
      border: 2px solid #eadfc2;
      border-radius: 12px;
      padding: 8px 4px 6px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
    }
    .card:hover { transform: translateY(-2px); }
    .card.selected {
      border-color: #f79e2d;
      box-shadow: 0 3px 10px rgba(247, 158, 45, 0.25);
      background: #fff8e8;
    }
    .card canvas { display: block; margin: 0 auto 2px; image-rendering: pixelated; }
    .card .label { font-size: 12px; font-weight: 600; }
    .card .tag { font-size: 10px; opacity: 0.55; min-height: 12px; }
    .names { display: grid; gap: 9px; }
    .namerow { display: grid; grid-template-columns: 112px 1fr; gap: 10px; align-items: center; }
    .namerow label { font-size: 13px; font-weight: 600; white-space: nowrap; }
    input {
      flex: 1;
      padding: 9px 12px;
      font: 15px -apple-system, sans-serif;
      border: 2px solid #eadfc2;
      border-radius: 10px;
      outline: none;
      background: #fffdf6;
      color: inherit;
    }
    input:focus { border-color: #f79e2d; }
    .actions { display: flex; justify-content: flex-end; margin-top: 12px; }
    button {
      padding: 9px 20px;
      font: 600 14px -apple-system, sans-serif;
      color: #fff;
      background: #f79e2d;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #e08c1d; }
    .hint { margin: 8px 0 0; font-size: 11px; opacity: 0.5; text-align: right; }
  </style>
</head>
<body>
  <h1>🥚 Pick your Quacker</h1>
  <p class="sub">It hatches from an egg either way — this is who's inside. Choose once; it's yours for good.</p>
  <div class="grid" id="grid"></div>
  <div class="names">
    <div class="namerow">
      <label for="duck-name">Duck's name:</label>
      <input id="duck-name" value="Quackers" maxlength="24" spellcheck="false" />
    </div>
    <div class="namerow">
      <label for="person-name">Your name:</label>
      <input id="person-name" maxlength="60" autocomplete="name" placeholder="What should your duck call you?" />
    </div>
  </div>
  <div class="actions">
    <button id="go" disabled>Hatch →</button>
  </div>
  <p class="hint">Stored in Quackers' local profile; included in API conversations.</p>
  <script src="skins.js"></script>
  <script src="onboarding.js"></script>
</body>
</html>
