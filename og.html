<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet" />
<style>
  *{margin:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;overflow:hidden;}
  body{
    background:radial-gradient(120% 100% at 30% -10%, #fff7e6 0%, #ffe9c6 34%, #f4cf9c 66%, #e7b482 100%);
    display:flex; align-items:center; gap:40px; padding:0 90px;
    font-family:"Fraunces",serif; color:#3a2f22;
    position:relative;
  }
  body::before{ content:""; position:absolute; inset:0;
    background:radial-gradient(120% 100% at 50% 45%, transparent 58%, rgba(120,78,32,.16) 100%); }
  .stage{ position:relative; flex:0 0 auto; }
  .stage .shadow{ position:absolute; left:50%; bottom:2px; width:70%; height:22px; transform:translateX(-50%);
    background:radial-gradient(closest-side, rgba(150,100,50,.4), transparent 78%); }
  canvas{ image-rendering:pixelated; display:block; filter:drop-shadow(0 16px 20px rgba(120,72,20,.22)); }
  .copy{ position:relative; z-index:2; }
  .brand{ display:flex; align-items:center; gap:16px; font-family:"Pixelify Sans",monospace; font-weight:600;
    font-size:96px; letter-spacing:.5px; line-height:1; }
  .brand .dot{ width:34px;height:34px;border-radius:50%;background:#f79e2d;box-shadow:0 0 0 9px #f79e2d33; }
  .tag{ font-style:italic; font-size:40px; color:#8a745a; margin-top:26px; }
  .url{ margin-top:44px; font-family:"Pixelify Sans",monospace; font-size:30px; color:#e8891a; }
</style>
</head>
<body>
  <div class="stage"><div class="shadow"></div><canvas id="d" width="300" height="290"></canvas></div>
  <div class="copy">
    <div class="brand"><span class="dot"></span>quackers</div>
    <div class="tag">a tiny experiment in companionship.</div>
    <div class="url">helloquackers.com&nbsp;&nbsp;🐣</div>
  </div>
<script>
  const ctx=document.getElementById('d').getContext('2d'); ctx.imageSmoothingEnabled=false;
  const COL={C:'#fff4da',O:'#e8d5ac',E:'#33302e',B:'#f79e2d',b:'#d97f14',K:'#ffc9c4',F:'#e8891a'};
  const BODY=['.....OCCCCO...','...OCCCCCCCO..','..OCCCCCCCCCO.','..OCCCCCCCCCO.','.OCCCCCCCCCCO.','.OCCCCCCCCCCO.','.OCCCCCCCCCCO.','.OCCCCCCCCCCO.','.OCCCCCCCCCCO.','.OCCCCCCCCCCO.','..OCCCCCCCCO..','..OCCCCCCCCO..','...OCCCCCCO...'];
  const P=20, ox=(300-14*P)/2, oy=6;
  const put=(c,r,col)=>{ctx.fillStyle=col;ctx.fillRect(ox+c*P,oy+r*P,P+0.6,P+0.6);};
  for(let r=0;r<13;r++)for(let c=0;c<14;c++){const ch=BODY[r][c];if(ch!=='.'&&COL[ch])put(c,r,COL[ch]);}
  for(const[c,r]of[[3,4],[4,4],[3,5],[4,5],[9,4],[10,4],[9,5],[10,5]])put(c,r,COL.E);
  for(const[c,r]of[[5,6],[6,6],[7,6],[8,6]])put(c,r,COL.B);
  for(const[c,r]of[[6,7],[7,7]])put(c,r,COL.b);
  for(const[c,r]of[[2,8],[3,8],[10,8],[11,8]])put(c,r,COL.K);
  for(const c of[3,4,5,8,9,10])put(c,13,COL.F);
</script>
</body>
</html>
